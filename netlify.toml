[build]
  command = "npm run build"
  publish = "dist"
  environment = { NODE_VERSION = "22" }
  # Skip the build when a push only touches files that don't affect the site
  # (README, CI workflows, check scripts). Exit 0 = skip, exit 1 = build.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ':(exclude)README.md' ':(exclude).github/' ':(exclude)scripts/'"

# Security headers for every page.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"

# Hashed build assets never change, so cache them forever.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Show the public PGP key as text in the browser.
[[headers]]
  for = "/pgp.asc"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
